<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Boxes</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <section class="box" data-box="1">
      <h2>Top Box</h2>
      <div class="options">
        <div class="colors">
          <span style="background-color: red"></span>
          <span style="background-color: green"></span>
          <span style="background-color: blue"></span>
        </div>
        <div class="sizes">
          <button>Small</button>
          <button>Medium</button>
          <button>Large</button>
        </div>
      </div>
    </section>

    <section class="box" data-box="2">
      <h2>Middle Box</h2>
      <div class="options">
        <div class="colors">
          <span style="background-color: orange"></span>
          <span style="background-color: purple"></span>
          <span style="background-color: teal"></span>
        </div>
        <div class="sizes">
          <button>Small</button>
          <button>Medium</button>
          <button>Large</button>
        </div>
      </div>
    </section>

    <section class="box" data-box="3">
      <h2>Bottom Box</h2>
      <div class="options">
        <div class="colors">
          <span style="background-color: pink"></span>
          <span style="background-color: yellow"></span>
          <span style="background-color: gray"></span>
        </div>
        <div class="sizes">
          <button>Small</button>
          <button>Medium</button>
          <button>Large</button>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>

</body>
</html>
